[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwbposition"
version = "0.1.0"
description = "UWB positioning experiments for DJI payload control"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
include = ["uwb_position*"]
